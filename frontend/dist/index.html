<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23c1440e'/><circle cx='40' cy='35' r='10' fill='%239e3308'/><circle cx='65' cy='60' r='18' fill='%23802905'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARES-Nav // Martian Map Tactical EVA System</title>
    <!-- Google Fonts for futuristic aerospace HUD styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/index-2upCvTbU.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-7JvnEKxg.css">
    
    <style>
      /* Ensure the transition scales to exactly 1.0 (no over-zoom or border clipping) */
      .local-map-transition {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 50 !important;
        overflow: hidden !important;
        background: #050608 !important;
        animation: localMapReveal 4.5s cubic-bezier(0.22, 0.8, 0.24, 1) forwards !important;
      }

      .local-map-surface {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
        display: block !important;
        background: #050608 !important;
      }

      .local-map-iframe {
        width: 100% !important;
        height: 100% !important;
        border: none !important;
        display: block !important;
        transform-origin: center center !important;
        animation: localMapIframeFocus 4.5s cubic-bezier(0.22, 0.8, 0.24, 1) forwards !important;
      }

      @keyframes localMapIframeFocus {
        0% { opacity: 0; filter: blur(20px) contrast(0.85); transform: scale(1.35); }
        40% { opacity: 0.35; filter: blur(12px) contrast(0.95); transform: scale(1.18); }
        72% { opacity: 0.88; filter: blur(3px) contrast(1); transform: scale(1.04); }
        100% { opacity: 1; filter: blur(0px) contrast(1); transform: scale(1.0) !important; }
      }

      /* Once ready, force strict 1:1 pixel rendering with zero crop or scale */
      .local-map-transition.local-map-transition--ready,
      .local-map-transition--ready .local-map-surface,
      .local-map-transition--ready .local-map-iframe {
        animation: none !important;
        transform: none !important;
        filter: none !important;
        border-radius: 0 !important;
      }
    </style>
  </head>
  <body class="bg-[#050608] text-slate-100 overflow-hidden select-none">
    <div id="root"></div>

    <!-- Direct Switcher to 2D Tactical Cell Map -->
    <button id="btnTactical2D" style="position: fixed; bottom: 24px; right: 24px; z-index: 25; background: rgba(9, 13, 20, 0.92); border: 1.5px solid #45f3ff; color: #45f3ff; font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 0.16em; padding: 11px 20px; text-decoration: none; border-radius: 2px; box-shadow: 0 0 24px rgba(69, 243, 255, 0.45); display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='#45f3ff'; this.style.color='#050608'; this.style.boxShadow='0 0 32px rgba(69, 243, 255, 0.8)';" onmouseout="this.style.background='rgba(9, 13, 20, 0.92)'; this.style.color='#45f3ff'; this.style.boxShadow='0 0 24px rgba(69, 243, 255, 0.45)';">
      <span style="font-size: 14px;">🗺️</span>
      <span>AMPLIAR A MAPA 2D POR CELDAS (USGS)</span>
    </button>

    <!-- Container for the cinematic transition to 2D local map -->
    <div id="localMapContainer" style="display: none;"></div>

    <script>
      function triggerCinematic2DTransition() {
        const container = document.getElementById('localMapContainer');
        if (!container) return;

        container.style.display = 'block';
        container.innerHTML = `
          <div class="local-map-transition" id="transitionWrapper">
            <div class="local-map-surface">
              <iframe src="/tactical" class="local-map-iframe" allow="fullscreen"></iframe>
            </div>
          </div>
        `;

        const wrapper = document.getElementById('transitionWrapper');
        const iframe = container.querySelector('iframe');

        // Once the 4.5s camera dive completes:
        setTimeout(() => {
          if (wrapper) {
            wrapper.classList.add('local-map-transition--ready');
            wrapper.style.transform = 'none';
            wrapper.style.animation = 'none';
          }
          if (iframe) {
            iframe.style.transform = 'none';
            iframe.style.animation = 'none';
            try {
              iframe.contentWindow.postMessage('transition-ready', '*');
            } catch (err) {}
          }
        }, 4500);
      }

      // Close message listener from inside tactical iframe
      window.addEventListener('message', (e) => {
        if (e.data === 'close-tactical') {
          const container = document.getElementById('localMapContainer');
          if (container) {
            container.style.display = 'none';
            container.innerHTML = '';
          }
        }
      });

      // Listen for click on Curiosity marker button or direct button
      document.addEventListener('click', (e) => {
        const target = e.target.closest('button');
        if (!target) return;
        const text = target.innerText ? target.innerText.toLowerCase() : '';
        if (text.includes('open local map') || text.includes('mapa 2d') || text.includes('hyperlocal')) {
          triggerCinematic2DTransition();
        }
      });
    </script>
  </body>
</html>
